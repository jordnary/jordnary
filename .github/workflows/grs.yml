name: Update README cards

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate stats card
        env:
          PROFILE_OWNER: ${{ github.repository_owner }}
        run: |
          # The repository token cannot read user contribution data.
          # Cache the public card in Git so outages do not break the README.
          curl --fail --silent --show-error --location \
            --retry 3 --connect-timeout 15 --max-time 60 \
            "https://github-readme-stats-fast.vercel.app/api?username=${PROFILE_OWNER}&show_icons=true&theme=tokyonight&hide_border=true" \
            --output profile/stats.svg

      - name: Generate top languages card
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: top-langs
          options: 'username=${{ github.repository_owner }}&layout=compact&theme=tokyonight&hide_border=true'
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate cards before committing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          for name in ("stats.svg", "top-langs.svg"):
              card = Path("profile") / name
              content = card.read_text(encoding="utf-8")
              root = ET.fromstring(content)
              if root.tag != "{http://www.w3.org/2000/svg}svg":
                  raise SystemExit(f"Invalid SVG: {card}")
              if not any(node.tag == "{http://www.w3.org/2000/svg}text" for node in root.iter()):
                  raise SystemExit(f"Missing card content: {card}")
              if any(message in content.lower() for message in (
                  "something went wrong", "resource not accessible", "forbidden",
                  'data-testid="message"',
              )):
                  raise SystemExit(f"Error card rejected: {card}")
              print(f"Validated {card}")
          PY

      - name: Commit and push SVG files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/*.svg

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "chore: update README stats cards"
          git push
